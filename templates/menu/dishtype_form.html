{% extends "base.html" %}
{% load crispy_forms_filters %}
{% load static %}

{% block content %}
  {% include 'includes/navigation.html' %}

  <div class="container mt-9">
    <div class="row">
      <div class="col-lg-6 mx-auto">
        <div class="card card-body blur shadow-blur">
          <div class="text-center mb-4">
            <h3 class="font-weight-bolder text-gradient text-primary">New Dish Category</h3>
            <p class="text-muted">Define a new type of cuisine or course</p>
          </div>

          <form action="" method="post" novalidate>
            {% csrf_token %}

            <div class="row">
              <div class="col-md-12">
                {{ form|crispy }}
              </div>
            </div>

            <div class="row mt-4">
              <div class="col-md-12 text-center">
                <button type="submit" class="btn bg-gradient-primary w-100 mb-0">
                  Create Category
                </button>
                <div class="mt-3">
                    <a href="{% url 'menu:dish-type-list' %}" class="text-sm text-secondary">
                        Cancel and go back
                    </a>
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
