{% extends "base.html" %}
{% load static %}

{% block content %}
  {% include 'includes/navigation.html' %}

  <div class="container mt-9">
    <div class="row">
      <div class="col-lg-6 mx-auto">
        <div class="card card-body blur shadow-blur text-center">
          <div class="icon icon-shape icon-lg bg-gradient-danger shadow text-center border-radius-xl mt-n4 mx-auto">
            <i class="material-icons opacity-10">warning</i>
          </div>

          <h3 class="mt-4 text-gradient text-danger font-weight-bolder">Confirm Deletion</h3>
          <p class="text-muted">
            Are you sure you want to delete <strong>"{{ object }}"</strong>?
            This will remove the record from the database permanently.
          </p>

          <form method="post">
            {% csrf_token %}
            <div class="d-flex justify-content-center mt-4">
              <button type="submit" class="btn bg-gradient-danger mb-0 me-2">Yes, Delete</button>
              <a href="javascript:history.back()" class="btn btn-outline-secondary mb-0">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
