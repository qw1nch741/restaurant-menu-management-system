{% extends "base.html" %}
{% block content %}
  {% include 'includes/navigation.html' %}
  <div class="container mt-9 mb-6">
    <div class="row">
      <div class="col-lg-6 mx-auto">
        <div class="card card-body blur shadow-blur p-4">
          <h3 class="text-gradient text-primary text-center mb-4">Cook Profile</h3>
          <form method="post" action="">
            {% csrf_token %}
            {% for field in form %}
              <div class="input-group input-group-static mb-4">
                <label>{{ field.label }}</label>
                {{ field }}
              </div>
            {% endfor %}
            <button type="submit" class="btn bg-gradient-primary w-100 mt-3">Save Cook</button>
            <a href="{% url 'menu:cook-list' %}" class="btn btn-link w-100 text-secondary">Back to List</a>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
