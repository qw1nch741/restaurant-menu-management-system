{% extends "base.html" %}

{% block content %}
  {% include 'includes/navigation.html' %}

  <div class="container mt-9">
    <div class="row">
      <div class="col-lg-6 mx-auto">
        <div class="card card-body blur shadow-blur text-center">
          <h3 class="text-gradient text-danger font-weight-bolder">Are you sure?</h3>
          <p class="text-muted mb-4">You are about to delete <strong>{{ object }}</strong>. This action cannot be undone.</p>

          <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn bg-gradient-danger w-100 mb-2">Confirm Delete</button>
            <a href="javascript:history.back()" class="btn btn-outline-secondary w-100">Cancel</a>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
